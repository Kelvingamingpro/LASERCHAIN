<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laser Cut Calculator — Key Required</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #ff3b3b;
      --accent-hover: #ff5555;
      --input: #12151a;
      --success: #34c759;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    #keyGate {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .gate-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .gate-card h1 { font-size: 1.35rem; margin-bottom: 6px; }
    .gate-card .sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.45;
    }
    .gate-card input {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .gate-card input:focus { border-color: var(--accent); }

    .gate-card .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .gate-card .btn:hover { background: var(--accent-hover); }
    .gate-card .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .gate-status {
      margin-top: 12px;
      font-size: 0.82rem;
      min-height: 20px;
    }
    .gate-status.error { color: #ff6b6b; }
    .gate-status.ok { color: var(--success); }
    .gate-status.loading { color: var(--muted); }

    .gate-help {
      margin-top: 18px;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
    }

    #app { display: flex; flex-direction: column; min-height: 100vh; }
    header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header .badge {
      font-size: 0.7rem;
      color: var(--muted);
      background: #22262e;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 7px;
      font-weight: 600;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .field label .unit { font-size: 0.68rem; opacity: 0.7; }

    .field input[type="number"] {
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 11px;
      border-radius: 7px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
    }
    .field input:focus { border-color: var(--accent); }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      line-height: 1.35;
      margin-top: 2px;
    }

    .pos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .pos-btn {
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 6px;
      border-radius: 7px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.12s;
      text-align: center;
    }
    .pos-btn:hover { border-color: #444; }
    .pos-btn.active {
      background: rgba(255, 59, 59, 0.15);
      border-color: var(--accent);
      color: #ff8a8a;
    }
    .pos-btn.free {
      grid-column: 1 / -1;
      background: rgba(52, 199, 89, 0.08);
      border-color: #2a6b3a;
    }
    .pos-btn.free.active {
      background: rgba(52, 199, 89, 0.2);
      border-color: var(--success);
      color: #7dffa0;
    }

    .coord-row {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .coord-row.show { display: grid; }

    .preview-wrap {
      background: #0a0c10;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .preview-toolbar {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--muted);
      background: #0d0f14;
      flex-shrink: 0;
    }
    .preview-toolbar .dim {
      color: var(--text);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .drag-hint {
      margin-left: auto;
      font-size: 0.72rem;
      color: #5a9;
      display: none;
    }
    .drag-hint.show { display: inline; }

    .canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }
    .canvas-area.dragging { cursor: grabbing; }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    #previewSvg {
      max-width: 100%;
      max-height: 100%;
      overflow: visible;
    }

    #previewSvg .hole {
      fill: none;
      stroke: #FF0000;
      stroke-width: 0.4;
      vector-effect: non-scaling-stroke;
      cursor: default;
    }
    #previewSvg .hole.draggable {
      cursor: grab;
      fill: rgba(255, 59, 59, 0.08);
    }
    #previewSvg .hole.draggable:hover {
      fill: rgba(255, 59, 59, 0.18);
    }
    .canvas-area.dragging #previewSvg .hole.draggable {
      cursor: grabbing;
      fill: rgba(255, 59, 59, 0.25);
    }

    footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-shrink: 0;
    }
    .footer-info {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .btn-export {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 11px 24px;
      border-radius: 9px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn-export:hover { background: var(--accent-hover); }
    .btn-export:active { transform: scale(0.98); }
    .btn-export svg { width: 17px; height: 17px; }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1c1f26;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 720px) {
      .main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
        max-height: 40vh;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- KEY GATE -->
  <div id="keyGate">
    <div class="gate-card">
      <h1>🔑 Key Required</h1>
      <p class="sub">
        Enter the key from <strong>Work.ink</strong> to unlock the Laser Cut Calculator.
      </p>
      <input type="text" id="keyInput" placeholder="Paste key here..." autocomplete="off" spellcheck="false" />
      <button class="btn" id="btnUnlock">Unlock</button>
      <div class="gate-status" id="gateStatus"></div>
      <p class="gate-help">
        Get a key by completing your Work.ink link.<br>
        API: <code style="font-size:0.7rem">work.ink/_api/v2/token/isValid/</code>
      </p>
    </div>
  </div>

  <div id="appContainer"></div>
  <div class="toast" id="toast">SVG successfully downloaded</div>

  <script>
    (function () {
      // 1. DOMAIN LOCK
      const ALLOWED_HOSTS = [
        "localhost",
        "127.0.0.1",
        window.location.hostname
      ];
      if (!ALLOWED_HOSTS.includes(window.location.hostname)) {
        document.body.innerHTML = "<h2 style='color:#fff;text-align:center;margin-top:20%'>Unauthorized Domain Access</h2>";
        throw new Error("Domain lock triggered.");
      }

      // 2. BLOCK DEVTOOLS SHORTCUTS
      window.addEventListener("keydown", function (e) {
        if (
          e.key === "F12" ||
          (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) ||
          (e.ctrlKey && (e.key === "U" || e.key === "s"))
        ) {
          e.preventDefault();
          return false;
        }
      });

      // 3. TAMPER PROTECTION
      let isUnlocked = false;
      const gateObserver = new MutationObserver(function () {
        const gate = document.getElementById("keyGate");
        if (!isUnlocked && (!gate || gate.style.display === "none")) {
          document.body.innerHTML = "<h2 style='color:#ff5555;text-align:center;margin-top:20%'>Tampering Detected</h2>";
          window.location.reload();
        }
      });
      gateObserver.observe(document.body, { childList: true, subtree: true, attributes: true });

      const KEY_STORAGE = "lcc_workink_key";

      function getKeyFromURL() {
        try {
          const params = new URLSearchParams(window.location.search);
          return (params.get("key") || params.get("token") || params.get("k") || "").trim();
        } catch (_) {
          return "";
        }
      }

      async function validateWorkInkKey(token) {
        const url = `https://work.ink/_api/v2/token/isValid/${encodeURIComponent(token.trim())}`;
        const res = await fetch(url, { method: "GET", cache: "no-store" });
        if (!res.ok) throw new Error("Network / API error");
        return await res.json();
      }

      function injectApplication() {
        isUnlocked = true;
        gateObserver.disconnect();
        const gate = document.getElementById("keyGate");
        if (gate) gate.remove();

        const container = document.getElementById("appContainer");
        container.innerHTML = `
          <div id="app">
            <header>
              <h1>Laser Cut Calculator</h1>
              <span class="badge">mm · Cut-Ready SVG</span>
            </header>
            <div class="main">
              <aside class="panel">
                <div>
                  <div class="section-title">Material Dimensions</div>
                  <div class="row-2">
                    <div class="field">
                      <label>Width <span class="unit">mm</span></label>
                      <input type="number" id="width" value="60" min="5" max="500" step="0.1" />
                    </div>
                    <div class="field">
                      <label>Height <span class="unit">mm</span></label>
                      <input type="number" id="height" value="40" min="5" max="500" step="0.1" />
                    </div>
                  </div>
                </div>
                <div>
                  <div class="section-title">Corners</div>
                  <div class="field">
                    <label>Radius <span class="unit">mm</span></label>
                    <input type="number" id="radius" value="5" min="0" max="50" step="0.1" />
                  </div>
                  <p class="hint">0 = sharp. Automatically clamped to avoid exceeding dimensions.</p>
                </div>
                <div>
                  <div class="section-title">Keychain Hole</div>
                  <div class="field">
                    <label>Diameter <span class="unit">mm</span></label>
                    <input type="number" id="holeDia" value="4" min="0" max="30" step="0.1" />
                  </div>
                  <div style="margin-top:10px">
                    <div class="section-title" style="margin-bottom:6px">Position</div>
                    <div class="pos-grid">
                      <button type="button" class="pos-btn active" data-pos="top-center">Top Center</button>
                      <button type="button" class="pos-btn" data-pos="top-left">Top Left</button>
                      <button type="button" class="pos-btn" data-pos="top-right">Top Right</button>
                      <button type="button" class="pos-btn" data-pos="left">Left</button>
                      <button type="button" class="pos-btn" data-pos="right">Right</button>
                      <button type="button" class="pos-btn" data-pos="none">No Hole</button>
                      <button type="button" class="pos-btn free" data-pos="free">✦ Custom / Drag</button>
                    </div>
                  </div>
                  <div class="coord-row" id="coordRow">
                    <div class="field">
                      <label>Center X <span class="unit">mm</span></label>
                      <input type="number" id="holeX" value="30" min="0" step="0.1" />
                    </div>
                    <div class="field">
                      <label>Center Y <span class="unit">mm</span></label>
                      <input type="number" id="holeY" value="5" min="0" step="0.1" />
                    </div>
                  </div>
                  <div class="field" id="offsetField" style="margin-top:10px">
                    <label>Edge Margin <span class="unit">mm</span></label>
                    <input type="number" id="holeOffset" value="3" min="0.5" max="40" step="0.1" />
                  </div>
                  <p class="hint" id="posHint">Select a preset position, or choose <strong>Custom / Drag</strong> to reposition directly on the preview.</p>
                </div>
                <div>
                  <div class="section-title">Export</div>
                  <p class="hint" style="margin:0">
                    Stroke <strong style="color:#ff3b3b">#FF0000</strong> hairline · mm units<br>
                    Ready for LightBurn / RDWorks.
                  </p>
                </div>
              </aside>
              <section class="preview-wrap">
                <div class="preview-toolbar">
                  <span>Preview</span>
                  <span class="dim" id="dimLabel">60 × 40 mm</span>
                  <span class="drag-hint" id="dragHint">← drag the hole to reposition</span>
                </div>
                <div class="canvas-area" id="canvasArea">
                  <div class="grid-overlay"></div>
                  <svg id="previewSvg" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
              </section>
            </div>
            <footer>
              <div class="footer-info">100% accurate · mm coordinates · laser-ready</div>
              <button class="btn-export" id="btnExport">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Export Cut-Ready SVG
              </button>
            </footer>
          </div>
        `;

        try {
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
          }
        } catch (_) {}

        startCalculatorEngine();
      }

      function startCalculatorEngine() {
        const $ = id => document.getElementById(id);
        const state = { pos: "top-center", holeX: 30, holeY: 5, dragging: false };

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function getValues() {
          const W = Math.max(1, parseFloat($("width").value) || 60);
          const H = Math.max(1, parseFloat($("height").value) || 40);
          let R = Math.max(0, parseFloat($("radius").value) || 0);
          R = Math.min(R, Math.min(W, H) / 2 - 0.001);
          const holeDia = Math.max(0, parseFloat($("holeDia").value) || 0);
          const holeOffset = Math.max(0, parseFloat($("holeOffset").value) || 3);
          return { W, H, R, holeDia, holeOffset };
        }

        function roundedRectPath(W, H, R) {
          if (R < 0.001) return `M0 0H${W}V${H}H0Z`;
          return [
            `M${R} 0`, `H${W - R}`,
            `A${R} ${R} 0 0 1 ${W} ${R}`,
            `V${H - R}`,
            `A${R} ${R} 0 0 1 ${W - R} ${H}`,
            `H${R}`,
            `A${R} ${R} 0 0 1 0 ${H - R}`,
            `V${R}`,
            `A${R} ${R} 0 0 1 ${R} 0`,
            `Z`
          ].join("");
        }

        function getHoleCenter(vals) {
          const { W, H, holeDia, holeOffset } = vals;
          if (state.pos === "none" || holeDia <= 0) return null;
          const r = holeDia / 2;
          if (state.pos === "free") {
            return {
              cx: clamp(state.holeX, r, W - r),
              cy: clamp(state.holeY, r, H - r),
              r
            };
          }
          const margin = holeOffset + r;
          let cx, cy;
          switch (state.pos) {
            case "top-center": cx = W / 2; cy = margin; break;
            case "top-left": cx = margin; cy = margin; break;
            case "top-right": cx = W - margin; cy = margin; break;
            case "left": cx = margin; cy = H / 2; break;
            case "right": cx = W - margin; cy = H / 2; break;
            default: cx = W / 2; cy = margin;
          }
          return { cx, cy, r };
        }

        function syncCoordInputs(cx, cy) {
          $("holeX").value = +cx.toFixed(2);
          $("holeY").value = +cy.toFixed(2);
          state.holeX = cx;
          state.holeY = cy;
        }

        function svgPoint(e) {
          const svg = $("previewSvg");
          const pt = svg.createSVGPoint();
          pt.x = e.clientX;
          pt.y = e.clientY;
          return pt.matrixTransform(svg.getScreenCTM().inverse());
        }

        function onDown(e) {
          if (state.pos !== "free") return;
          e.preventDefault();
          state.dragging = true;
          $("canvasArea").classList.add("dragging");
          e.target.setPointerCapture?.(e.pointerId);
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
          window.addEventListener("pointercancel", onUp);
        }

        function onMove(e) {
          if (!state.dragging) return;
          const vals = getValues();
          const r = vals.holeDia / 2;
          const pt = svgPoint(e);
          const cx = clamp(pt.x, r, vals.W - r);
          const cy = clamp(pt.y, r, vals.H - r);
          state.holeX = cx;
          state.holeY = cy;
          syncCoordInputs(cx, cy);
          const circle = $("holeCircle");
          if (circle) { circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); }
          const txt = $("coordText");
          if (txt) {
            txt.setAttribute("x", cx);
            txt.setAttribute("y", cy + r + 4);
            txt.textContent = `${cx.toFixed(1)}, ${cy.toFixed(1)}`;
          }
        }

        function onUp() {
          state.dragging = false;
          $("canvasArea").classList.remove("dragging");
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          window.removeEventListener("pointercancel", onUp);
          updatePreview();
        }

        function attachDrag() {
          const circle = $("holeCircle");
          if (!circle || state.pos !== "free") return;
          circle.addEventListener("pointerdown", onDown);
        }

        function updatePreview() {
          const vals = getValues();
          const { W, H, R } = vals;
          const hole = getHoleCenter(vals);

          $("dimLabel").textContent = `${W.toFixed(1)} × ${H.toFixed(1)} mm`;

          const pad = Math.max(3, Math.min(W, H) * 0.1);
          const svg = $("previewSvg");
          svg.setAttribute("viewBox", `${-pad} ${-pad} ${W + pad * 2} ${H + pad * 2}`);
          svg.style.width = "min(92vw, 540px)";
          svg.style.height = "min(68vh, 460px)";

          let html = `<path d="${roundedRectPath(W, H, R)}" fill="none" stroke="#FF0000" stroke-width="0.4" vector-effect="non-scaling-stroke"/>`;

          if (hole) {
            const cls = state.pos === "free" ? "hole draggable" : "hole";
            html += `<circle class="${cls}" id="holeCircle" cx="${hole.cx}" cy="${hole.cy}" r="${hole.r}"/>`;
            if (state.pos === "free") {
              const fs = Math.max(2.2, Math.min(W, H) * 0.05);
              html += `<text id="coordText" x="${hole.cx}" y="${hole.cy + hole.r + fs * 1.5}" text-anchor="middle" fill="#6a9" font-size="${fs}" font-family="system-ui">${hole.cx.toFixed(1)}, ${hole.cy.toFixed(1)}</text>`;
            }
          }

          const fs = Math.max(2.4, Math.min(W, H) * 0.055);
          html += `<text x="${W / 2}" y="${-pad * 0.4}" text-anchor="middle" fill="#555" font-size="${fs}" font-family="system-ui">${W} mm</text>`;
          html += `<text x="${-pad * 0.42}" y="${H / 2}" text-anchor="middle" fill="#555" font-size="${fs}" font-family="system-ui" transform="rotate(-90 ${-pad * 0.42} ${H / 2})">${H} mm</text>`;

          svg.innerHTML = html;
          attachDrag();
        }

        function setPosition(pos) {
          state.pos = pos;
          document.querySelectorAll(".pos-btn").forEach(btn => {
            btn.classList.toggle("active", btn.dataset.pos === pos);
          });
          const isFree = pos === "free";
          const isNone = pos === "none";
          $("coordRow").classList.toggle("show", isFree);
          $("offsetField").style.display = (isFree || isNone) ? "none" : "block";
          $("dragHint").classList.toggle("show", isFree);
          $("posHint").innerHTML = isFree
            ? "Drag the hole directly in the preview, or enter custom X/Y coordinates. The hole stays clamped within bounds."
            : isNone
              ? "Keychain hole disabled."
              : "Select a preset position, or choose <strong>Custom / Drag</strong> to reposition directly on the preview.";

          if (isFree) {
            const vals = getValues();
            const r = vals.holeDia / 2;
            state.holeX = clamp(state.holeX ?? vals.W / 2, r, vals.W - r);
            state.holeY = clamp(state.holeY ?? (vals.holeOffset + r), r, vals.H - r);
            syncCoordInputs(state.holeX, state.holeY);
          }
          updatePreview();
        }

        function generateSVG() {
          const vals = getValues();
          const { W, H, R } = vals;
          const hole = getHoleCenter(vals);
          const pathD = roundedRectPath(W, H, R);

          let svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}" version="1.1">
  <g id="Cut" stroke="#FF0000" fill="none" stroke-width="0.01" stroke-linecap="round" stroke-linejoin="round">
    <path d="${pathD}"/>`;
          if (hole) {
            svg += `\n    <circle cx="${+hole.cx.toFixed(4)}" cy="${+hole.cy.toFixed(4)}" r="${+hole.r.toFixed(4)}"/>`;
          }
          svg += `\n  </g>\n</svg>`;
          return svg;
        }

        function download() {
          const content = generateSVG();
          const { W, H } = getValues();
          const blob = new Blob([content], { type: "image/svg+xml;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `keychain_${W}x${H}mm_cut.svg`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          const toast = $("toast");
          toast.textContent = `SVG ${W}×${H} mm downloaded — ready to cut`;
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 2000);
        }

        ["width", "height", "radius", "holeDia", "holeOffset"].forEach(id => {
          $(id).addEventListener("input", () => {
            if (state.pos === "free") {
              const vals = getValues();
              const r = vals.holeDia / 2;
              state.holeX = clamp(state.holeX, r, vals.W - r);
              state.holeY = clamp(state.holeY, r, vals.H - r);
              syncCoordInputs(state.holeX, state.holeY);
            }
            updatePreview();
          });
        });
        $("holeX").addEventListener("input", () => {
          state.holeX = parseFloat($("holeX").value) || 0;
          updatePreview();
        });
        $("holeY").addEventListener("input", () => {
          state.holeY = parseFloat($("holeY").value) || 0;
          updatePreview();
        });
        document.querySelectorAll(".pos-btn").forEach(btn => {
          btn.addEventListener("click", () => setPosition(btn.dataset.pos));
        });
        $("btnExport").addEventListener("click", download);

        setPosition("top-center");
      }

      async function tryUnlock(token, fromStorage = false) {
        const status = document.getElementById("gateStatus");
        const btn = document.getElementById("btnUnlock");
        const input = document.getElementById("keyInput");

        if (!token || token.length < 3) {
          if (status) {
            status.className = "gate-status error";
            status.textContent = "Key is too short.";
          }
          return;
        }

        if (input) input.value = token.trim();
        if (btn) btn.disabled = true;
        if (status) {
          status.className = "gate-status loading";
          status.textContent = "Validating key...";
        }

        try {
          const data = await validateWorkInkKey(token);
          if (data && data.valid === true) {
            try { localStorage.setItem(KEY_STORAGE, token.trim()); } catch (_) {}
            if (status) {
              status.className = "gate-status ok";
              status.textContent = "Key valid ✓ Launching app...";
            }
            setTimeout(injectApplication, 400);
          } else {
            if (status) {
              status.className = "gate-status error";
              status.textContent = "Key is invalid or has expired.";
            }
            if (fromStorage) {
              try { localStorage.removeItem(KEY_STORAGE); } catch (_) {}
            }
          }
        } catch (err) {
          if (status) {
            status.className = "gate-status error";
            status.textContent = "Failed to reach Work.ink (CORS / network issue).";
          }
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      const fromURL = getKeyFromURL();
      if (fromURL) {
        tryUnlock(fromURL, false);
      } else {
        try {
          const saved = localStorage.getItem(KEY_STORAGE);
          if (saved) tryUnlock(saved, true);
        } catch (_) {}
      }

      document.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById("btnUnlock");
        const input = document.getElementById("keyInput");
        if (btn) btn.addEventListener("click", () => tryUnlock(input ? input.value : ""));
        if (input) input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") tryUnlock(input.value);
        });
      });
    })();
  </script>
</body>
</html>
